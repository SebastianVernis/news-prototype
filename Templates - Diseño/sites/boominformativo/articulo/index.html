<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artículo - BoomInformativo</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="../style-custom.css" rel="stylesheet">
<style>
.article-page{max-width:800px;margin:40px auto;padding:0 24px;font-family:sans-serif;line-height:1.8;}
.article-page h1{font-size:2.2rem;margin-bottom:15px;}
.article-page .meta{color:#888;font-size:0.9rem;margin-bottom:20px;}
.article-page .feat-img{width:100%;max-height:450px;object-fit:cover;border-radius:8px;margin-bottom:25px;}
.article-page .content{font-size:1.05rem;color:#333;}
.article-page .content p{margin-bottom:15px;}
</style>
</head><body>
<div id="site-preloader"></div><div id="site-header"></div>
<main class="article-page">
<div id="article-content"><p style="text-align:center;padding:60px;">Cargando artículo...</p></div>
</main>
<div id="site-footer"></div>
<script src="../components.js"></script>
<script>
(function(){
    var params=new URLSearchParams(window.location.search);
    var slug=params.get("slug");if(!slug)return;
    fetch("https://news-api.sebastianvernis.workers.dev/api/articles/"+encodeURIComponent(slug)+"?site=boominformativo")
    .then(function(r){return r.json();})
    .then(function(d){
        var a=d.article||d;if(!a||!a.title)return;
        document.title=a.title+" - BoomInformativo";
        var h="<h1>"+a.title+"</h1>";
        h+='<div class="meta"><span><i class="far fa-user"></i> '+(a.author||"Redacción")+'</span> &bull; <span><i class="far fa-calendar"></i> '+(a.publishedAt?new Date(a.publishedAt).toLocaleDateString("es-MX"):"")+'</span> &bull; <span>'+(a.category||"General")+'</span></div>';
        if(a.imageUrl)h+='<img class="feat-img" src="'+a.imageUrl+'" alt="">';
        h+='<div class="content">'+(a.content||a.excerpt||"")+'</div>';
        document.getElementById("article-content").innerHTML=h;
    }).catch(function(e){console.error(e);});
})();
</script>
</body></html>
