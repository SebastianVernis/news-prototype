<!-- users.html - Vista de Usuarios (se carga vía Router) -->
<div class="page-header">
    <h1><i class="fas fa-users"></i> Gestión de Usuarios</h1>
</div>

<div class="card">
    <div class="card-header">
        <h2>Usuarios del Sistema</h2>
        <button class="btn-primary" onclick="UsersModule.openGenerateLink()">
            <i class="fas fa-link"></i> Generar Link de Contraseña
        </button>
    </div>
    <div class="card-body">
        <div id="users-loading" style="text-align:center; padding:40px;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Cargando usuarios...</p>
        </div>
        <div id="users-error" class="alert alert-error" style="display:none;"></div>
        <div id="users-table-wrap" style="display:none;">
            <table class="data-table" id="users-table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para generar link -->
<div id="generate-link-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-link"></i> Generar Link de Contraseña</h3>
            <button class="modal-close" onclick="UsersModule.closeGenerateLink()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="alert alert-info" style="margin-bottom:16px;">
                <i class="fas fa-info-circle"></i>
                El link generado será válido por 24 horas y solo podrá usarse una vez.
            </div>
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" id="gl-username" class="form-control" readonly>
            </div>
            <div id="gl-loading" style="display:none; text-align:center; padding:20px;">
                <i class="fas fa-spinner fa-spin"></i> Generando link...
            </div>
            <div id="gl-error" class="alert alert-error" style="display:none;"></div>
            <div id="gl-success" class="alert alert-success" style="display:none;">
                <strong>¡Link generado!</strong> Copia y envía este enlace al usuario:
            </div>
            <div id="gl-link-wrap" style="display:none; margin-top:12px;">
                <div class="link-display" id="gl-link-display" style="
                    background:#f3f4f6; border:1px solid #d1d5db; border-radius:6px;
                    padding:10px; font-family:monospace; font-size:0.85rem;
                    word-break:break-all; margin-bottom:12px;
                "></div>
                <button class="btn-secondary" onclick="UsersModule.copyLink()">
                    <i class="fas fa-copy"></i> Copiar Link
                </button>
            </div>
        </div>
        <div class="modal-footer" id="gl-footer">
            <button class="btn-secondary" onclick="UsersModule.closeGenerateLink()">Cancelar</button>
            <button class="btn-primary" onclick="UsersModule.doGenerateLink()">
                <i class="fas fa-magic"></i> Generar Link
            </button>
        </div>
    </div>
</div>

<script>
// Inicializar la vista de usuarios
if (window.UsersModule) {
    UsersModule.render();
}
</script>
