<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CMS Noticias Hoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .login-logo p {
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .login-error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.85rem;
        }
        .login-footer a {
            color: #667eea;
            text-decoration: none;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <h1><i class="fas fa-newspaper"></i> Noticias Hoy</h1>
                <p>Panel de Administración</p>
            </div>
            
            <div id="login-error" class="login-error"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" id="username" class="form-control" 
                           placeholder="Ingresa tu usuario" required autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" 
                           placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="btn-login" id="login-btn">
                    <span id="login-btn-text">Iniciar Sesión</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>¿Necesitas ayuda? <a href="#">Contacta al administrador</a></p>
            </div>
        </div>
    </div>

    <script>
        // Configurar base URL
         window.ADMIN_API_BASE_URL = window.ADMIN_API_BASE_URL || 'https://cms-nuevos2.sebastianvernis.workers.dev/api';
    </script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            const loginBtnText = document.getElementById('login-btn-text');
            
            if (!username || !password) {
                errorDiv.textContent = 'Por favor ingresa usuario y contraseña';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Mostrar loading
            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading-spinner"></span> Iniciando...';
            errorDiv.style.display = 'none';
            
            try {
                const result = await Auth.login(username, password);
                
                if (result.success) {
                    // Redireccionar al dashboard
                    window.location.hash = 'dashboard';
                    window.location.reload();
                }
            } catch (e) {
                errorDiv.textContent = e.message || 'Error al iniciar sesión. Verifica tus credenciales.';
                errorDiv.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
