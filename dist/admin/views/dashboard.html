<div class="header">
    <h2>Dashboard</h2>
</div>

<div class="form-row" style="margin-bottom: 2rem;">
    <div class="card">
        <div style="color: var(--text-secondary);">Total Artículos Públicos</div>
        <div id="dash-total-articles" style="font-size: 2rem; font-weight: bold; color: var(--primary-color);">0</div>
    </div>
    <div class="card">
        <div style="color: var(--text-secondary);">Sitios Activos</div>
        <div id="dash-active-sites" style="font-size: 2rem; font-weight: bold; color: var(--secondary-color);">10</div>
    </div>
</div>

<div class="table-container">
    <h3 style="padding: 1rem; border-bottom: 1px solid var(--border-color);">Artículos Publicados Recientemente</h3>
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody id="recent-articles-tbody"></tbody>
    </table>
</div>
