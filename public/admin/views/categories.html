<div class="header">
    <h2>Categorías Maestras</h2>
    <button class="btn btn-primary" onclick="showNewCategoryModal()">
        <i class="fas fa-plus"></i> Nueva Categoría
    </button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Slug</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="categories-master-table">
            <tr><td colspan="3" style="text-align:center; padding:1rem;">Cargando...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Nueva Categoría -->
<div id="category-modal" class="preview-modal" style="display:none; align-items:center; justify-content:center;">
    <div class="form-container" style="max-width:400px; width:100%; margin:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3>Nueva Categoría</h3>
            <button class="btn btn-danger" onclick="closeCategoryModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="form-group">
            <label class="form-label">Nombre de la Categoría</label>
            <input type="text" class="form-control" id="new-category-name" placeholder="Ej: Nacional, Deportes, Tecnología..." autofocus>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="createCategory()">
            <i class="fas fa-save"></i> Crear Categoría
        </button>
    </div>
</div>
