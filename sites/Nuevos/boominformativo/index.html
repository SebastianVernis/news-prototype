<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoomInformativo - Noticias en Tiempo Real</title>
    <meta name="description" content="BoomInformativo - Noticias digitales en tiempo real.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="style-custom.css" rel="stylesheet">
    <link rel="alternate" type="application/rss+xml" title="BoomInformativo RSS" href="/rss.xml">
    <style>
        /* Preloader Styles - Colores Dinámicos */
        #preloader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-navy, #0A192F);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        #preloader-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .preloader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .preloader-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            animation: preloader-pulse 1.5s ease-in-out infinite;
        }
        
        .loader {
            width: 48px;
            height: 48px;
            display: inline-block;
            position: relative;
            background: var(--accent-cyan, #00E5FF);
            box-sizing: border-box;
            animation: flipX 1s linear infinite;
            border-radius: 4px;
        }
        
        @keyframes flipX {
            0% {
                transform: perspective(200px) rotateX(0deg) rotateY(0deg);
            }
            50% {
                transform: perspective(200px) rotateX(-180deg) rotateY(0deg);
            }
            100% {
                transform: perspective(200px) rotateX(-180deg) rotateY(-180deg);
            }
        }
        
        @keyframes preloader-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

<!-- Preloader -->
<div id="preloader-container">
    <div class="preloader-wrapper">
        <img src="logo.png" alt="BoomInformativo" class="preloader-logo" onerror="this.src='logo-header.png'">
        <span class="loader"></span>
    </div>
</div>

<div id="site-preloader"></div>
<div id="site-header"></div>

<main>
        <section class="hero-section">
            <div class="hero-img-box">
                </div>
            <div class="hero-text-box">
                <h1></h1>
                <p></p>
            </div>
        </section>

        <section class="diagonal-section">
            <div class="diagonal-content">
                <h2></h2>
            </div>
        </section>

        <section class="asymmetric-grid">

            <article class="grid-item item-large">
                <span class="tag"></span>
                <h3></h3>
            </article>

            <article class="grid-item item-tall">
                <span class="tag"></span>
                <h3></h3>
            </article>

            <article class="grid-item">
                <span class="tag"></span>
                <h3></h3>
            </article>

            <article class="grid-item">
                <span class="tag"></span>
                <h3></h3>
            </article>

        </section>
    </main>

<div id="site-footer"></div>

<script src="components.js"></script>
<script src="script.js"></script>
<script>
// Preloader Logic
(function() {
    const preloader = document.getElementById('preloader-container');
    
    // Hide preloader when page is fully loaded
    window.addEventListener('load', function() {
        setTimeout(function() {
            preloader.classList.add('hidden');
            // Remove from DOM after transition
            setTimeout(function() {
                preloader.style.display = 'none';
            }, 500);
        }, 1500); // Minimum 1.5s to show animation
    });
})();

// Article Loading
(function() {
    var API = "https://news-api.sebastianvernis.workers.dev/api/articles?site=boominformativo&limit=20";
    function esc(t){if(!t)return"";return String(t).replace(/&/g,"\&amp;").replace(/</g,"\&lt;").replace(/>/g,"\&gt;");}
    function enc(t){return encodeURIComponent(t||"");}

    async function load(){
        try{
            var r=await fetch(API);if(!r.ok)throw new Error("err");
            var d=await r.json();var arts=d.articles;
            if(!arts||!arts.length)return;
            populate(arts);
        }catch(e){console.error("Error:",e);}
    }

    function populate(arts){
        var main=document.querySelector("main");if(!main)return;
        var ai=0;

        // === HERO IMAGE: Set background on .hero-img-box from first article ===
        var heroImgBox=main.querySelector(".hero-img-box");
        if(heroImgBox&&arts[0]&&arts[0].imageUrl){
            heroImgBox.style.backgroundImage="url("+arts[0].imageUrl+")";
            heroImgBox.style.backgroundSize="cover";
            heroImgBox.style.backgroundPosition="center";
        }

        // Find all article-like containers in the original layout
        var containers=main.querySelectorAll(
            "article, .hero, .hero-content, .hero-text, .hero-text-box, .hero-headline,"
            +".z-content, .focus-section, .side-item, .side-article, .grid-item,"
            +".scroll-content, .video-card, .minimal-card, .gallery-card, .classic-card,"
            +".card, .card-body, .brief-card, .tech-card, .grid-card, .scroll-card,"
            +".hero-card > .hero-content, .hero-section .hero-content"
        );

        // Deduplicate: skip children if parent is already in list
        var seen=new Set();
        var unique=[];
        containers.forEach(function(el){
            // Skip if a parent is already in our list
            var dominated=false;
            seen.forEach(function(s){
                if(s.contains(el)&&s!==el)dominated=true;
            });
            if(!dominated){unique.push(el);seen.add(el);}
        });

        unique.forEach(function(el){
            if(ai>=arts.length)return;
            var a=arts[ai];
            var link="articulo/index.html?slug="+enc(a.slug);

            // Populate heading
            var heading=el.querySelector("h1,h2,h3,h4");
            if(heading){
                heading.innerHTML='<a href="'+link+'" style="color:inherit;text-decoration:none;">'+esc(a.title)+'</a>';
            }

            // Populate excerpt
            var para=el.querySelector("p:not(.author-meta):not(.img-caption)");
            if(para&&a.excerpt)para.textContent=a.excerpt;

            // Populate category tag
            var tag=el.querySelector(".tag,.tag-pill,.category-tag,.category,.category-label,.category-pill,.hero-tag,.card-meta");
            if(tag&&a.category)tag.textContent=a.category;

            // Populate image placeholder (background-image on div)
            var imgDiv=el.querySelector("div[class*=img],div[class*=image],div[class*=thumb],div[class*=placeholder]");
            if(imgDiv&&a.imageUrl){
                imgDiv.style.backgroundImage="url("+a.imageUrl+")";
                imgDiv.style.backgroundSize="cover";
                imgDiv.style.backgroundPosition="center";
            }

            // Also set background-image on grid-items that have no img div
            if(!imgDiv&&a.imageUrl&&el.classList.contains("grid-item")){
                el.style.backgroundImage="linear-gradient(to bottom, transparent 30%, rgba(10,25,47,0.9)), url("+a.imageUrl+")";
                el.style.backgroundSize="cover";
                el.style.backgroundPosition="center";
            }

            // Fix read-more links
            var rm=el.querySelector("a.read-more,a.read-link,a.btn-outline,a.read-btn,a[href='#']");
            if(rm)rm.href=link;

            ai++;
        });

        // Populate numbered lists (Swiss Design, etc.)
        var listItems=main.querySelectorAll(".numbered-list li,.trending-list li");
        listItems.forEach(function(el,i){
            if(!arts[i])return;
            var span=el.querySelector("span");
            if(span)span.textContent=arts[i].title;
            else el.textContent=arts[i].title;
        });

        // Populate marquee/ticker
        var marquee=main.querySelector(".marquee,marquee");
        if(marquee)marquee.textContent=arts.slice(0,5).map(function(a){return"+++ "+a.title.toUpperCase();}).join(" ");

        // Populate newspaper columns
        var cols=main.querySelector(".newspaper-columns");
        if(cols&&arts[0]){
            var credit=cols.querySelector(".author-credit");
            if(credit&&arts[0].author)credit.textContent="Por "+arts[0].author;
            var paras=cols.querySelectorAll("p");
            paras.forEach(function(p,i){if(arts[i]&&arts[i].excerpt)p.textContent=arts[i].excerpt;});
        }
    }

    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",load);
    else load();
})();
</script>

</body>
</html>
