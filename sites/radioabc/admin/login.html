<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - radioabc - CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-city"></i>
                </div>
                <h1>radioabc</h1>
                <p>Sistema de Gestión de Contenidos</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="token">Token de Autenticación</label>
                    <div class="token-input-wrapper">
                        <input type="text" id="token" class="form-control" 
                               placeholder="Ingrese su token de 64 dígitos" 
                               maxlength="64" 
                               pattern="[a-fA-F0-9]{64}"
                               required>
                        <button type="button" id="toggle-token" class="btn-icon">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint">Token hexadecimal de 64 caracteres</small>
                </div>

                <button type="submit" class="btn-primary btn-block btn-lg">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p><i class="fas fa-shield-alt"></i> Autenticación segura con token de 256 bits</p>
            </div>
        </div>

        <div class="login-info">
            <h2>Panel de Administración</h2>
            <ul>
                <li><i class="fas fa-check"></i> Gestión completa de artículos</li>
                <li><i class="fas fa-check"></i> Creación y edición en tiempo real</li>
                <li><i class="fas fa-check"></i> Organización por categorías</li>
                <li><i class="fas fa-check"></i> Exportación de datos</li>
            </ul>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="login.js"></script>
</body>
</html>
