<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reporte Central MX - Periodismo de Investigación</title>
    <meta content="Periodismo de investigación. Análisis profundo de la realidad mexicana." name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="Reporte Central MX RSS" href="/rss.xml"/>
</head>
<body>

<div id="site-preloader"></div>
<div id="site-header"></div>

<main class="main-content">
    <div class="container">
        <!-- Newspaper layout -->
        <section class="featured-section">
            <div id="featured-container">
                <div style="text-align:center;padding:60px;color:#9B3D3F;">Cargando noticias...</div>
            </div>
        </section>

        <!-- Grid adicional -->
        <section class="news-section" id="news-section">
            <h2 class="section-title">Más Noticias</h2>
            <div id="news-container" class="card-grid"></div>
        </section>
    </div>
</main>

<div id="site-footer"></div>

<script src="components.js"></script>
<script src="script.js"></script>
<script>
(function() {
    const API = 'https://cms-originaux.sebastianvernis.workers.dev/api/articles?site=reportecentralmx&limit=20';

    async function loadArticles() {
        try {
            const res = await fetch(API);
            if (!res.ok) throw new Error('Network error');
            const {articles} = await res.json();
            if (!articles?.length) {
                document.getElementById('featured-container').innerHTML =
                    '<div style="text-align:center;padding:60px;color:#9B3D3F;">No hay noticias disponibles.</div>';
                return;
            }
            renderNewspaper(articles.slice(0, 7));
            renderGrid(articles.slice(7));
        } catch(e) {
            console.error('Error:', e);
            document.getElementById('featured-container').innerHTML =
                '<div style="text-align:center;padding:60px;color:#C2185B;">Error al cargar noticias.</div>';
        }
    }

    function renderNewspaper(articles) {
        const container = document.getElementById('featured-container');
        if (!container || !articles.length) return;

        const main   = articles[0];
        const stack  = articles.slice(1, 3);
        const row    = articles.slice(3, 7);

        const stackHtml = stack.map(a => `
            <div class="np-stack-item">
                <div class="np-thumb">
                    <a href="articulo/index.html?slug=${enc(a.slug)}">
                        <img src="${a.imageUrl || 'logo.png'}" alt="${esc(a.title)}" loading="lazy">
                    </a>
                </div>
                <span class="category-badge cat-${esc((a.category||'general').toLowerCase())}">${esc(a.category||'General')}</span>
                <h3><a href="articulo/index.html?slug=${enc(a.slug)}">${esc(a.title)}</a></h3>
                <p>${esc(a.excerpt||'')}</p>
                <div class="np-meta">
                    <span><i class="far fa-user"></i> ${esc(a.author||'Redacción')}</span>
                    <span><i class="far fa-calendar"></i> ${a.publishedAt ? new Date(a.publishedAt).toLocaleDateString('es-MX') : ''}</span>
                </div>
            </div>`).join('');

        const rowHtml = row.map(a => `
            <div class="np-text-card">
                <div class="np-thumb-sm">
                    <a href="articulo/index.html?slug=${enc(a.slug)}">
                        <img src="${a.imageUrl || 'logo.png'}" alt="${esc(a.title)}" loading="lazy">
                    </a>
                </div>
                <span class="category-badge cat-${esc((a.category||'general').toLowerCase())}">${esc(a.category||'General')}</span>
                <h4><a href="articulo/index.html?slug=${enc(a.slug)}">${esc(a.title)}</a></h4>
                <p>${esc(a.excerpt||'')}</p>
                <div class="np-meta">
                    <span><i class="far fa-calendar"></i> ${a.publishedAt ? new Date(a.publishedAt).toLocaleDateString('es-MX') : ''}</span>
                </div>
            </div>`).join('');

        container.innerHTML = `
            <div class="newspaper-top">
                <article class="np-main">
                    <div class="np-img">
                        <a href="articulo/index.html?slug=${enc(main.slug)}">
                            <img src="${main.imageUrl || 'logo.png'}" alt="${esc(main.title)}" loading="lazy">
                        </a>
                    </div>
                    <div class="np-body">
                        <span class="category-badge cat-${esc((main.category||'general').toLowerCase())}">${esc(main.category||'General')}</span>
                        <h2><a href="articulo/index.html?slug=${enc(main.slug)}">${esc(main.title)}</a></h2>
                        <p>${esc(main.excerpt||'')}</p>
                        <div class="np-meta">
                            <span><i class="far fa-user"></i> ${esc(main.author||'Redacción')}</span>
                            <span><i class="far fa-calendar"></i> ${main.publishedAt ? new Date(main.publishedAt).toLocaleDateString('es-MX') : ''}</span>
                        </div>
                    </div>
                </article>
                <div class="np-stack">${stackHtml}</div>
            </div>
            ${row.length ? `<div class="newspaper-row">${rowHtml}</div>` : ''}`;
    }

    function renderGrid(articles) {
        const container = document.getElementById('news-container');
        const section   = document.getElementById('news-section');
        if (!container) return;
        if (!articles.length) { if (section) section.style.display = 'none'; return; }

        container.innerHTML = articles.map(a => `
            <article class="article-card">
                <div class="card-image-wrapper">
                    <a href="articulo/index.html?slug=${enc(a.slug)}">
                        <img src="${a.imageUrl || 'logo.png'}" alt="${esc(a.title)}" loading="lazy">
                    </a>
                </div>
                <div class="card-content">
                    <span class="card-category-badge cat-${esc((a.category||'general').toLowerCase())}">${esc(a.category||'General')}</span>
                    <h3 class="card-title"><a href="articulo/index.html?slug=${enc(a.slug)}">${esc(a.title)}</a></h3>
                    <p class="card-excerpt">${esc(a.excerpt||'')}</p>
                    <div class="card-footer">
                        <span class="card-author"><i class="far fa-user"></i> ${esc(a.author||'Redacción')}</span>
                        <span class="card-date"><i class="far fa-calendar"></i> ${a.publishedAt ? new Date(a.publishedAt).toLocaleDateString('es-MX') : ''}</span>
                    </div>
                </div>
            </article>`).join('');
    }

    function esc(t) {
        if (!t) return '';
        return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function enc(t) { return encodeURIComponent(t || ''); }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadArticles);
    } else { loadArticles(); }
})();
</script>

</body>
</html>
