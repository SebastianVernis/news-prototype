<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SocialMexico - Noticias</title>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    <main class="main-content">
        <section id="latest-container" data-api="https://cms-nuevos2.sebastianvernis.workers.dev/api/articles?site=socialmexiconews&limit=12"></section>
        <section class="news-section">
            <h2 style="text-align:center; margin: 40px 0 30px; font-size:2em;">Más Noticias</h2>
            <div id="news-container" class="news-grid"></div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = document.querySelector('#latest-container')?.dataset.api;
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) { console.error(e); }
        if(!articles.length) return;
        const heroArticles = articles.slice(0, 3);
        const listArticles = articles.slice(3);
        const heroContainer = document.getElementById('latest-container');
        if(heroContainer) {
            
      heroContainer.innerHTML = '';
      if(heroArticles[0]) {
        heroContainer.innerHTML += '<a href="/articulo/' + heroArticles[0].slug + '" class="hero-card viral-main">' +
            '<img src="' + (heroArticles[0].imageUrl || 'https://placehold.co/800x600/8e24aa/ffffff?text=VIRAL') + '" alt="Hero">' +
            '<div class="hero-content"><h2>🔥 ' + heroArticles[0].title + '</h2></div>' +
          '</a>';
      }
      if(heroArticles[1]) {
        heroContainer.innerHTML += '<div class="viral-sidebar">' +
            '<h3>Tendencias</h3>' +
            '<a href="/articulo/' + heroArticles[1].slug + '" class="trending-item">' +
              '<img src="' + (heroArticles[1].imageUrl || 'https://placehold.co/100x100/e91e63/ffffff?text=#') + '" alt="Trend">' +
              '<span>' + heroArticles[1].title + '</span>' +
            '</a>' +
          '</div>';
      }
    
        }
        const newsContainer = document.getElementById('news-container');
        if(newsContainer) {
            newsContainer.innerHTML = '';
            listArticles.forEach(a => {
                newsContainer.innerHTML += '<a href="/articulo/' + a.slug + '" class="news-card">' +
                    '<img src="' + (a.imageUrl || 'https://placehold.co/300x200/8e24aa/ffffff?text=News') + '" alt="' + a.title + '">' +
                    '<div class="news-content">' +
                        '<h3 class="news-title">' + a.title + '</h3>' +
                        '<p class="news-desc">' + (a.desc ? a.desc.substring(0, 100) + '...' : '') + '</p>' +
                    '</div>' +
                '</a>';
            });
        }
    })();
    </script>
</body>
</html>
