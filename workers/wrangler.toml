name = "news-cron"
main = "cron-worker.js"
compatibility_date = "2023-12-01"
account_id = "adf5d76bca341500fec8b8c04941978a"

# ============================================================
# Cron Worker — ingesta de noticias + actualización de ticker
# Se ejecuta cada hora automáticamente.
# ============================================================

[triggers]
crons = ["0 * * * *"]   # Cada hora en punto

[build]
command = "npm install"

# ── Variables de entorno ──────────────────────────────────────
[vars]
# NewsAPI (Usar wrangler secret put NEWSAPI_KEY)
NEWS_QUERY = "Mexico noticias"
NEWS_LANGUAGE = "es"
NEWS_PAGE_SIZE = "20"

# Ingesta / Parafraseo
DEFAULT_CATEGORY = "Nacional"
DEFAULT_TAGS = "actualidad,noticias"
DEFAULT_SITES = "noticiasobjetivo,mexicoinformado,bitacoraurbana,nodoinformativo,cbnnoticias,centralmexico,verticenoticias,radiocinconoticias,reportecentralmx,tvmexico"
CLEANUP_DAYS = "30"
# OPENROUTER_API_KEY (Usar wrangler secret put OPENROUTER_API_KEY)
PARAPHRASE_MODEL = "arcee-ai/trinity-large-preview:free"

# Ticker en vivo
API_BASE = "https://news-api.sebastianvernis.workers.dev/api"
# ADMIN_TOKEN (Usar wrangler secret put ADMIN_TOKEN)

# ── Base de datos D1 ──────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "news_db"
database_id = "039ec6ab-8f14-4e79-8f02-021df67a6c18"

# ── KV Namespace ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "ARTICLES_KV"
id = "fbf21fb75f5647a8966858d199b44e0b"
preview_id = "fbf21fb75f5647a8966858d199b44e0b"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1